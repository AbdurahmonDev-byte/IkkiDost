[package]
name = "ikki-dost-cashier"
version = "0.4.1"
description = "Ikki Do'st cashier desktop"
authors = ["Ikki Do'st"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ikki_dost_cashier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }
