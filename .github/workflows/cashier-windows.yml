name: Cashier Windows build

on:
  push:
    branches: [main]
    paths:
      - 'legacy/cashier-desktop/**'
      - 'packages/**'
      - '.github/workflows/cashier-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: legacy/cashier-desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_API_URL: https://ikkidost.abitcore.uz/api
        with:
          projectPath: legacy/cashier-desktop
          tauriScript: npx tauri

      - uses: actions/upload-artifact@v4
        with:
          name: ikki-dost-kassir-windows
          path: legacy/cashier-desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
