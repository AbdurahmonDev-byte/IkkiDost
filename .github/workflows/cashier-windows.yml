name: Cashier Windows exe

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'legacy/cashier-desktop/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/cashier-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: legacy/cashier-desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows exe (no installer)
        working-directory: legacy/cashier-desktop
        env:
          VITE_API_URL: https://ikkidost.abitcore.uz/api
          # Optional shared key; must equal CASHIER_KIOSK_KEY on the server.
          VITE_KIOSK_KEY: ${{ secrets.CASHIER_KIOSK_KEY }}
        run: npx tauri build --no-bundle

      - name: Name the exe
        shell: pwsh
        run: |
          $v = (Get-Content legacy/cashier-desktop/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item legacy/cashier-desktop/src-tauri/target/release/ikki-dost-cashier.exe "out/IkkiDost-Kassa-$v.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ikki-dost-kassa-exe
          path: out/*.exe
          if-no-files-found: error
