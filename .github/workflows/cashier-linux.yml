name: Cashier Linux AppImage

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'legacy/cashier-desktop/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/cashier-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: legacy/cashier-desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          VITE_API_URL: https://ikkidost.abitcore.uz/api
          # Optional shared key; must equal CASHIER_KIOSK_KEY on the server.
          VITE_KIOSK_KEY: ${{ secrets.CASHIER_KIOSK_KEY }}
        with:
          projectPath: legacy/cashier-desktop
          tauriScript: npx tauri
          args: --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: ikki-dost-kassir-linux
          path: legacy/cashier-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
